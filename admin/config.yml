# The admin page at trvco.studio/admin. Sign in with GitHub; "Publish" saves to the repo and
# Netlify rebuilds the site (about a minute). Type and Goods come from Shopify, not from here.
backend:
  name: github
  repo: TrevCo623/trvco-studio
  branch: main
  commit_messages:
    create: 'Add {{collection}} project “{{slug}}”'
    update: 'Update {{collection}} project “{{slug}}”'
    delete: 'Remove {{collection}} project “{{slug}}”'
    uploadMedia: 'Upload “{{path}}”'
    deleteMedia: 'Delete “{{path}}”'

site_url: https://trvco.studio
display_url: https://trvco.studio
logo_url: /assets/icons/icon-192.png
media_folder: assets/uploads
public_folder: /assets/uploads

collections:
  - name: print
    label: Print
    label_singular: Print project
    description: Invitations, posters, packaging… Shown with the same layout as Goods.
    folder: content/print
    extension: json
    format: json
    create: true
    delete: true
    slug: '{{slug}}'
    preview_path: 'print/{{slug}}'
    editor: { preview: false }
    summary: '{{title}}'
    sortable_fields: [order, title]
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Description, name: description, widget: text, required: false, hint: 'A blank line starts a new paragraph.' }
      - label: Photos
        name: images
        widget: photos
        multiple: true
        hint: The first photo is the thumbnail on the homepage. Pick or drop several at once; drag to reorder.
      - { label: Position on the Print page, name: order, widget: position, folder: content/print, required: false }
      - { label: Hidden, name: draft, widget: boolean, required: false, default: false, hint: 'Hide this project from the site without deleting it.' }

  - name: digital
    label: Digital
    label_singular: Digital project
    description: Apps and digital case studies.
    folder: content/digital
    extension: json
    format: json
    create: true
    delete: true
    slug: '{{slug}}'
    preview_path: 'digital/{{slug}}'
    editor: { preview: false }
    summary: '{{title}}'
    sortable_fields: [order, title]
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Intro, name: intro, widget: text, hint: 'The paragraph under the title.' }
      - label: Photos
        name: photos
        widget: photos
        multiple: true
        max: 2
        tags: [Thumbnail, Hero]
        hint: 'Photo 1 is the homepage thumbnail. Photo 2 is the big image at the top of the page (if there''s only one, it''s used for both).'
      - { label: Wide hero, name: hero_wide, widget: boolean, required: false, default: false, hint: 'Turn on for landscape (desktop) screenshots.' }
      - { label: Sections, name: sections, widget: sections, required: false, hint: 'The case study under the hero, top to bottom, as it will look. Drag ⋮⋮ to reorder.' }
      - { label: Carousel heading, name: carousel_title, widget: string, required: false, hint: 'Optional line above the carousel.' }
      - { label: Carousel closing line, name: carousel_title_end, widget: string, required: false, hint: 'Byways only: replaces the heading while the last screen scrolls through its full page.' }
      - { label: Carousel, name: carousel, widget: photos, multiple: true, captions: true, required: false, hint: 'A click-through carousel near the end of the page (landscape images work best). Drop them all at once; the line under each is optional.' }
      - { label: Second carousel heading, name: carousel2_title, widget: string, required: false, hint: 'Byways only.' }
      - { label: Second carousel, name: carousel2, widget: photos, multiple: true, captions: true, required: false, hint: 'Byways only: a second phone carousel under the first.' }
      - { label: Position on the Digital page, name: order, widget: position, folder: content/digital, required: false }
      - { label: Hidden, name: draft, widget: boolean, required: false, default: false, hint: 'Hide this project from the site without deleting it.' }
